[global_tags]
  probe  = "${PROBE_NAME}"
  region = "${PROBE_REGION}"
  site   = "${PROBE_SITE}"

[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "5s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  logfile = ""                 
  quiet = false
  omit_hostname = true        


# Inputs

[[inputs.exec]]

  commands = ["/opt/netprobe/scripts/fping2influx.sh"]
  interval = "${ICMP_INTERVAL}"   
  timeout  = "${ICMP_TIMEOUT}"   
  data_format = "influx"
  name_override = "netprobe_icmp" 


[[outputs.influxdb_v2]]
  urls          = ["${INFLUX_URL}"] 
  token         = "${INFLUX_TOKEN}"
  organization  = "${INFLUX_ORG}"
  bucket        = "${INFLUX_BUCKET}"